name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checkout lilylet dependency
        uses: actions/checkout@v4
        with:
          repository: k-l-lambda/lilylet
          path: lilylet

      - name: Checkout music-widgets dependency
        uses: actions/checkout@v4
        with:
          repository: k-l-lambda/web-widgets
          path: music-widgets

      - name: Build lilylet
        run: |
          cd lilylet
          # Remove private package dependency that's not needed for library build
          sed -i '/"@k-l-lambda\/lotus"/d' package.json
          npm install
          npm run build:grammar
          npm run build

      - name: Build music-widgets
        run: |
          cd music-widgets
          npm install
          npm run build
          # Update package.json to point to the dist bundle as main
          sed -i 's|"main": "lib/index.js"|"main": "dist/musicWidgetsBrowser.common.js"|' package.json
          # Create a stub lib/index.js that re-exports from dist for subpath imports
          mkdir -p lib
          echo 'module.exports = require("../dist/musicWidgetsBrowser.common.js");' > lib/index.js

      - name: Update package.json dependency paths
        run: |
          sed -i 's|"@k-l-lambda/lilylet": "file:../lilylet"|"@k-l-lambda/lilylet": "file:./lilylet"|' package.json
          sed -i 's|"@k-l-lambda/music-widgets": "[^"]*"|"@k-l-lambda/music-widgets": "file:./music-widgets"|' package.json
          # Remove package-lock.json since dependency paths change
          rm -f package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
